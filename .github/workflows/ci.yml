name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RideAway.sln

      - name: Build
        run: dotnet build RideAway.sln --no-restore --configuration Release --verbosity normal

      - name: Test
        run: dotnet test RideAway.sln --no-build --configuration Release --verbosity normal

      - name: Publish
        run: dotnet publish RideAway.API/RideAway.API.csproj -c Release --no-build -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rideaway-api
          path: publish/
