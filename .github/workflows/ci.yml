name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore RideAway.sln

      - name: Build
        run: dotnet build RideAway.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test RideAway.sln --no-build --configuration Release --verbosity normal
